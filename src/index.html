<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><title>Folder Frog</title>
<style>
:root{--ink:#f3f0ff;--mute:#a79fcb;--line:rgba(255,255,255,.12);--glass:rgba(255,255,255,.055);--v:#8b5cf6;--frog:#7dff8a}
*{box-sizing:border-box}
body{margin:0;height:100vh;font:14px 'Segoe UI',system-ui,sans-serif;color:var(--ink);padding:22px;
 background:radial-gradient(900px 500px at 20% -10%,#3b1d8f 0,transparent 60%),radial-gradient(700px 500px at 100% 110%,#2a1470 0,transparent 60%),#0d0a1f;
 display:grid;grid-template-rows:auto 1fr auto;gap:18px;overflow:hidden}
header{display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--frog),#2bbf5a);display:grid;place-items:center;font-size:22px}
h1{font-size:20px;margin:0;font-weight:600}header p{margin:0;color:var(--mute);font-size:12px}
main{display:grid;grid-template-columns:1.05fr 1fr;gap:18px;min-height:0}
.card{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:18px;backdrop-filter:blur(18px);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.col{display:flex;flex-direction:column;gap:18px;min-height:0}
h2{font-size:12px;font-weight:600;color:var(--mute);margin:0 0 12px}
#drop{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;border-style:dashed}
#drop.over{border-color:var(--v);background:rgba(139,92,246,.12)}
#prev{width:230px;height:230px;filter:drop-shadow(0 18px 30px rgba(0,0,0,.45))}
#path{color:var(--mute);font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button{font:inherit;color:var(--ink);cursor:pointer;border:1px solid var(--line);background:var(--glass);border-radius:12px;padding:9px 16px;transition:.15s}
button:hover{background:rgba(255,255,255,.12)}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--v);outline-offset:2px}
button.primary{background:linear-gradient(135deg,#8b5cf6,#6d3df0);border-color:transparent;font-weight:600;padding:11px 26px}
button:disabled{opacity:.4;cursor:not-allowed}
.sw{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-bottom:14px}
.sw i{aspect-ratio:1;border-radius:10px;cursor:pointer;border:2px solid transparent}.sw i.on{border-color:#fff}
.row{display:flex;gap:10px;align-items:center}
input[type=color]{width:52px;height:40px;border:1px solid var(--line);border-radius:10px;background:none;padding:2px;cursor:pointer}
input[type=text],select{flex:1;background:rgba(0,0,0,.28);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;color-scheme:dark}
label.t{display:flex;align-items:center;gap:8px;margin-top:14px;color:var(--mute);cursor:pointer}
footer{display:flex;justify-content:space-between;align-items:center;gap:12px}
#msg{color:var(--mute);font-size:13px}
</style></head><body>
<header><div class="logo">🐸</div><div><h1>Folder Frog</h1><p>Warnai folder dan beri label status</p></div></header>
<main>
 <section class="card" id="drop">
  <svg id="prev" viewBox="0 0 256 256"></svg>
  <div id="path">Belum ada folder dipilih. Seret folder ke sini.</div>
  <button id="pick">Pilih folder</button>
 </section>
 <div class="col">
  <section class="card"><h2>Warna folder</h2>
   <div class="sw" id="sw"></div>
   <div class="row"><input type="color" id="cp" value="#8b5cf6" aria-label="Pilih warna"><input type="text" id="hex" maxlength="7" value="#8b5cf6" aria-label="Kode HEX"></div>
  </section>
  <section class="card"><h2>Label di atas folder</h2>
   <select id="lab"><option value="">Tanpa teks</option><option>To Do</option><option>On Progress</option><option>Waiting Feedback</option><option>Revision</option><option>Cancel</option><option>FA</option></select>
   <label class="t"><input type="checkbox" id="flag" checked> Tampilkan ikon flag</label>
  </section>
 </div>
</main>
<footer><span id="msg"></span><div class="row"><button id="reset" disabled>Kembalikan default</button><button id="apply" class="primary" disabled>Terapkan</button></div></footer>
<script>
const COL=['#ef4444','#f97316','#f59e0b','#eab308','#84cc16','#22c55e','#10b981','#14b8a6','#06b6d4','#3b82f6','#6366f1','#8b5cf6','#d946ef','#ec4899','#94a3b8','#475569'];
const FLAG={'To Do':'#60a5fa','On Progress':'#fb923c','Waiting Feedback':'#facc15','Revision':'#c084fc','Cancel':'#f87171','FA':'#4ade80'};
const $=id=>document.getElementById(id);let dir=null,color='#8b5cf6';
const shade=(h,p)=>{const n=parseInt(h.slice(1),16),t=p<0?0:255,k=Math.abs(p);return'#'+[n>>16,n>>8&255,n&255].map(c=>Math.round((t-c)*k+c).toString(16).padStart(2,'0')).join('')};
function svg(){const l=$('lab').value,f=$('flag').checked,fc=FLAG[l]||'#f8fafc',fs=Math.min(34,190/(l.length*.58||1));
return `<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${shade(color,.18)}"/><stop offset="1" stop-color="${shade(color,-.12)}"/></linearGradient></defs>
<path d="M24 56a16 16 0 0 1 16-16h62l22 22h92a16 16 0 0 1 16 16v128a16 16 0 0 1-16 16H40a16 16 0 0 1-16-16z" fill="${shade(color,-.38)}"/>
<rect x="40" y="70" width="176" height="60" rx="6" fill="#fff" opacity=".92"/>
<path d="M16 100a16 16 0 0 1 16-16h192a16 16 0 0 1 16 16v100a16 16 0 0 1-16 16H32a16 16 0 0 1-16-16z" fill="url(#g)"/>
${f?`<rect x="188" y="26" width="7" height="92" rx="3" fill="#e5e7eb"/><path d="M195 30C215 20 225 40 247 30V72C225 82 215 62 195 72Z" fill="${fc}" stroke="rgba(0,0,0,.25)" stroke-width="2"/>`:''}
${l?`<rect x="28" y="150" width="200" height="46" rx="23" fill="rgba(0,0,0,.5)"/><text x="128" y="${173+fs*.35}" text-anchor="middle" font-family="Segoe UI,Arial" font-weight="700" font-size="${fs}" fill="#fff">${l}</text>`:''}`}
const draw=()=>{$('prev').innerHTML=svg();$('hex').value=color;$('cp').value=color;[...$('sw').children].forEach(e=>e.classList.toggle('on',e.dataset.c===color))};
COL.forEach(c=>{const e=document.createElement('i');e.style.background=c;e.dataset.c=c;e.onclick=()=>{color=c;draw()};$('sw').append(e)});
$('cp').oninput=e=>{color=e.target.value;draw()};
$('hex').oninput=e=>{if(/^#[0-9a-f]{6}$/i.test(e.target.value)){color=e.target.value.toLowerCase();draw()}};
$('lab').onchange=draw;$('flag').onchange=draw;
function setDir(p){dir=p;$('path').textContent=p;$('apply').disabled=$('reset').disabled=false;$('msg').textContent=''}
$('pick').onclick=async()=>{const p=await frog.pick();if(p)setDir(p)};
frog.onOpen(setDir);
const dz=$('drop');dz.ondragover=e=>{e.preventDefault();dz.classList.add('over')};dz.ondragleave=()=>dz.classList.remove('over');
dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');const f=e.dataTransfer.files[0];if(f)setDir(frog.pathOf(f))};
async function png(){const im=new Image();im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">${svg()}</svg>`);await im.decode();const c=document.createElement('canvas');c.width=c.height=256;c.getContext('2d').drawImage(im,0,0);return c.toDataURL('image/png').split(',')[1]}
async function run(fn,ok){$('msg').textContent='Memproses…';try{await fn();$('msg').textContent=ok}catch(e){$('msg').textContent='Gagal: '+e.message}}
$('apply').onclick=()=>run(async()=>frog.apply(dir,await png()),'Folder berhasil diwarnai.');
$('reset').onclick=()=>run(()=>frog.reset(dir),'Folder dikembalikan ke default.');
draw();
</script></body></html>
